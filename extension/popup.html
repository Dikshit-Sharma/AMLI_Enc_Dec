<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitLab LOC Report</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h2>GitLab LOC Report</h2>
    </div>
    <p class="popup-desc">Generate LOC reports from GitLab commits in a date range.</p>
    <button id="openReport" class="btn-primary">Open Full Report</button>
    <p class="popup-hint">Opens a full-page tool with form and results.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
