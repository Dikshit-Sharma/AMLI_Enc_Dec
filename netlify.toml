[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/artifacts"
  to = "/.netlify/functions/artifacts"
  status = 200

[[redirects]]
  from = "/api/credentials"
  to = "/.netlify/functions/credentials"
  status = 200

[[redirects]]
  from = "/api/bsa"
  to = "/.netlify/functions/bsa"
  status = 200

[[redirects]]
  from = "/api/bsa-report"
  to = "/.netlify/functions/bsa-report"
  status = 200

[[redirects]]
  from = "/api/api-lib-cache"
  to = "/.netlify/functions/api-lib-cache"
  status = 200

[[redirects]]
  from = "/api/clipboard"
  to = "/.netlify/functions/clipboard"
  status = 200

[[redirects]]
  from = "/api/clipboard-report"
  to = "/.netlify/functions/clipboard-report"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  [functions."weekly-digest"]
    schedule = "30 3 * * MON"
    # Required env vars (set in Netlify UI): SENDGRID_API_KEY, DIGEST_RECIPIENT, DIGEST_FROM, GROQ_API_KEY
  [functions."bsa-report"]
    schedule = "30 3 * * MON"
  [functions."clipboard-report"]
    schedule = "30 3 * * MON"
