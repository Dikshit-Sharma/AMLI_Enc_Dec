[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/artifacts"
  to = "/.netlify/functions/artifacts"
  status = 200

[[redirects]]
  from = "/api/credentials"
  to = "/.netlify/functions/credentials"
  status = 200

[[redirects]]
  from = "/api/api-lib-cache"
  to = "/.netlify/functions/api-lib-cache"
  status = 200

[[redirects]]
  from = "/api/jenkins-proxy"
  to = "/.netlify/functions/jenkins-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # Weekly Ecosystem Digest — runs every Monday at 9 AM IST (3:30 UTC)
  [functions."weekly-digest"]
    schedule = "30 3 * * MON"
    # Required env vars for weekly-digest (set in Netlify UI):
    # SENDGRID_API_KEY     — SendGrid API key for sending email
    # DIGEST_RECIPIENT     — Email address to receive digest (default: dikshit.sharma2580@gmail.com)
    # DIGEST_FROM          — From address (default: amli-digest@amliaes.netlify.app)
    # GROQ_API_KEY         — Optional: enables AI-generated summary in the digest
